name = "nethub-accounts-d1-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[vars]
ALLOW_IN_MEMORY_REPLAY = "false"

[[durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

[[migrations]]
tag = "replay-guard-v1"
new_sqlite_classes = ["ReplayGuard"]

[[d1_databases]]
binding = "DB"
database_name = "nethub-accounts-d1"
database_id = "5ccc1c31-b9dc-4d5d-a033-8915d206d8e4"