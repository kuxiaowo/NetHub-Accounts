{% extends "base.html" %}
{% block language_switch %}
  <form method="post" action="{{ url_for('governance.display_invitation', lang='zh' if language == 'en' else 'en') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="invite" value="{{ invitation_token }}">
    <button class="preference-control language-toggle" type="submit" aria-label="{{ '切换到中文' if language == 'en' else 'Switch to English' }}">{{ '中文' if language == 'en' else 'EN' }}</button>
  </form>
{% endblock %}
{% block content %}<section class="panel"><h1>{{ t("邀请已生成") }}</h1><p>{{ t("请复制并妥善保存；完整凭证只展示这一次，有效至") }} {{ expires|beijing_time }}。</p><label>{{ t("邀请链接") }}<input readonly value="{{ link }}" aria-label="{{ t("邀请链接") }}"></label><a href="{{ url_for('governance.community') }}">{{ t("返回邀请管理") }}</a></section>{% endblock %}
