{% extends "base.html" %}
{% block title %}{{ t("登录 · NetHub Accounts") }}{% endblock %}
{% block head %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endblock %}
{% block content %}
<section class="auth-card">

  <h1>{{ t("登录 NetHub") }}</h1>
  <p>{{ t("可使用原 TodoList / TechX 账号登录。") }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.values.get('next', '') }}">
    <label>{{ t("用户名") }}<input name="username" autocomplete="username" required autofocus></label>
    <label>{{ t("密码") }}<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="cf-turnstile" data-language="{{ 'en' if language == 'en' else 'zh-cn' }}" data-sitekey="{{ config.TURNSTILE_SITE_KEY }}" data-action="login"></div>
    <button class="button full" type="submit">{{ t("登录") }}</button>
  </form>
  {% if registration_enabled %}<p class="muted">{{ t("还没有账号？") }}<a href="{{ url_for('web.register', next=request.values.get('next', '')) }}">{{ t("注册") }}</a></p>{% endif %}
</section>
{% endblock %}
