{% extends "base.html" %}
{% block title %}{{ t("正在返回 · NetHub Accounts") }}{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">SIGNED IN</p>
  <h1>{{ t("登录成功，正在返回") }}</h1>
  <p>{{ t("如果页面没有自动跳转，请点击下面的按钮继续。") }}</p>
  <button class="button full" type="button" data-auth-continue data-destination="{{ destination }}" disabled>{{ t("继续") }}</button>
  <noscript>
    <p>{{ t("浏览器未启用 JavaScript，请使用下面的链接继续。") }}</p>
    <a class="button full" href="{{ destination }}">{{ t("继续") }}</a>
  </noscript>
</section>
{% endblock %}
{% block scripts %}
  <script src="{{ url_for('static', filename='continue.js', v='auth3') }}" defer></script>
{% endblock %}
